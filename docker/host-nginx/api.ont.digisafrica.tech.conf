# Host Nginx — reverse proxy TLS → Docker (127.0.0.1:8080)
# Install on VPS:
#   sudo cp docker/host-nginx/api.ont.digisafrica.tech.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/api.ont.digisafrica.tech.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.ont.digisafrica.tech
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.ont.digisafrica.tech;

    # Certbot will replace this with HTTPS after: certbot --nginx -d api.ont.digisafrica.tech
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }
}
