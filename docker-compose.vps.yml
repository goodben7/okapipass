# OkapiPass API — stack VPS / staging (MySQL 8)
# Usage:
#   cp .env.vps.dist .env.vps && nano .env.vps
#   docker compose -f docker-compose.vps.yml --env-file .env.vps up -d --build

name: okapipass

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: okapipass_php
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      DB_HOST: mysql
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      # Force MySQL Docker service (overrides any leftover postgres in .env)
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./:/var/www/html:rw
      - composer_cache:/tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - okapipass

  # Symfony Messenger — async queue (mails, notifs, payment checks, activity…)
  # Transport: doctrine://default → table messenger_messages in MySQL
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: okapipass_worker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/worker-entrypoint"]
    env_file:
      - .env.vps
    environment:
      DB_HOST: mysql
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: ${DATABASE_URL}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
    volumes:
      - ./:/var/www/html:rw
      - composer_cache:/tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - okapipass

  nginx:
    image: nginx:1.27-alpine
    container_name: okapipass_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - okapipass

  mysql:
    image: mysql:8.0
    container_name: okapipass_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootchangeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-okapipass}
      MYSQL_USER: ${MYSQL_USER:-okapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-okapichangeme}
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=64M
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-rootchangeme}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - okapipass

  mailpit:
    image: axllent/mailpit
    container_name: okapipass_mailpit
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - okapipass

volumes:
  mysql_data:
  composer_cache:

networks:
  okapipass:
    driver: bridge
