# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    flexpay_callback_url_default: 'https://api.okapipass.pteron.pro/api/payments/webhook/flexpay'
    flexpay_payment_url_default: 'https://backend.flexpay.cd/api/rest/v1/paymentService'
    flexpay_check_status_url_default: 'https://apicheck.flexpaie.com/api/rest/v1/check/%s'
    flexpay_card_pay_url_default: 'https://cardpayment.flexpay.cd/v2/pay'
    flexpay_card_approve_url_default: 'https://okapi-pass-v2.vercel.app/payment/success?ref={ref}'
    flexpay_card_cancel_url_default: 'https://okapi-pass-v2.vercel.app/payment/cancelled?ref={ref}'
    flexpay_card_decline_url_default: 'https://okapi-pass-v2.vercel.app/payment/failed?ref={ref}&reason={reason}'
    agency_pass_validate_strict_default: '0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\NotificationService:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $senders: !tagged_iterator 'app.notification_sender'

    App\Service\MailNotificationSender:
        arguments:  
            $mailerSender: '%env(MAILER_SENDER)%'
            $mailerSenderName: '%env(MAILER_SENDER_NAME)%'
        tags: [ 'app.notification_sender' ]

    App\Service\WhatsappNotificationSender:
        arguments:
            $whatsappApiKey: '%env(ULTRAMSG_API_KEY)%'
            $whatsappInstanceId: '%env(ULTRAMSG_INSTANCE_ID)%'
        tags: [ 'app.notification_sender' ]

    App\Domain\Agency\PassValidationService:
        arguments:
            $strict: '%env(bool:default:agency_pass_validate_strict_default:AGENCY_PASS_VALIDATE_STRICT)%'

    App\Contract\AgencySmsSenderInterface: '@App\Service\Agency\LoggingAgencySmsSender'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\FlexPayGateway:
        arguments:
            $merchantId: '%env(FLEXPAY_MERCHANT_ID)%'
            $token: '%env(FLEXPAY_TOKEN)%'
            $callbackUrl: '%env(default:flexpay_callback_url_default:FLEXPAY_CALLBACK_URL)%'
            $paymentUrl: '%env(default:flexpay_payment_url_default:FLEXPAY_PAYMENT_URL)%'
            $cardPayUrl: '%env(default:flexpay_card_pay_url_default:FLEXPAY_CARD_PAY_URL)%'
            $checkStatusUrl: '%env(default:flexpay_check_status_url_default:FLEXPAY_CHECK_STATUS_URL)%'
            $cardApproveUrl: '%env(default:flexpay_card_approve_url_default:FLEXPAY_CARD_APPROVE_URL)%'
            $cardCancelUrl: '%env(default:flexpay_card_cancel_url_default:FLEXPAY_CARD_CANCEL_URL)%'
            $cardDeclineUrl: '%env(default:flexpay_card_decline_url_default:FLEXPAY_CARD_DECLINE_URL)%'
