# OkapiPass — MySQL (pas Postgres)
services:
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: okapipass_database
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-okapipass}
      MYSQL_USER: ${MYSQL_USER:-okapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-okapi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw

volumes:
  database_data:
