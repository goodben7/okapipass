name: Deploy (VPS)

# Déploie sur le VPS après un push sur main (ou manuellement).
# Prérequis secrets GitHub : VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR
# Optionnel : VPS_PORT (défaut 22)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # Réutilise la même logique que CI avant de toucher le VPS
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret_change_me
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/okaoi?serverVersion=8.0&charset=utf8mb4
      JWT_PASSPHRASE: ""
      MAILER_SENDER: ci@okapipass.test
      MAILER_SENDER_NAME: OkapiPass CI
      ULTRAMSG_API_KEY: ci-dummy
      ULTRAMSG_INSTANCE_ID: ci-dummy
      FLEXPAY_MERCHANT_ID: ci-dummy
      FLEXPAY_TOKEN: ci-dummy
      AGENCY_PASS_VALIDATE_STRICT: "0"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: okaoi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Generate JWT keypair
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -in config/jwt/private.pem -pubout -out config/jwt/public.pem
      - name: Migrate & test
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/phpunit

  deploy:
    needs: [phpunit]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (Docker VPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" || true
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            COMPOSE="docker compose -f docker-compose.vps.yml --env-file .env.vps"

            # Build images ; mysql/nginx up ; stop php/worker avant wipe cache
            $COMPOSE build
            $COMPOSE up -d mysql nginx
            $COMPOSE stop worker php || true

            # Wipe + composer hors FPM (entrypoint désactivé pour éviter warmup concurrent)
            $COMPOSE run --rm --no-deps --entrypoint sh php -c '
              set -e
              git config --global --add safe.directory /var/www/html || true
              mkdir -p var/cache var/log
              find var/cache -mindepth 1 -delete 2>/dev/null || rm -rf var/cache/dev var/cache/prod || true
              mkdir -p var/cache
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
            '

            $COMPOSE up -d php
            # Attendre entrypoint (migrate/warmup)
            sleep 10

            $COMPOSE exec -T php \
              php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            # Warm only — jamais cache:clear pendant FPM actif
            $COMPOSE exec -T php \
              php bin/console cache:warmup --no-interaction || true

            $COMPOSE restart nginx
            sleep 5

            # Healthcheck (éviter case/;; — mal parsé par drone-ssh)
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/docs || echo 000)
            echo "Health /api/docs → HTTP ${code}"
            if [ "${code}" != "200" ] && [ "${code}" != "301" ] && [ "${code}" != "302" ]; then
              echo "Deploy healthcheck failed"
              $COMPOSE start worker || true
              exit 1
            fi

            $COMPOSE start worker

            echo "Deploy OK → $(git rev-parse --short HEAD)"
